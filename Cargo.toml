[package]
name = "mattermost-tui"
description = "Keyboard-driven terminal client for Mattermost"
authors = ["Paul Chambaz <paul.chambaz@tutanota.com>"]
homepage = "https://github.com/paulchambaz/mattermost-tui"
version = "1.1.1"
edition = "2021"
include = ["/src/**/*", "/mm.1.scd", "/README.md", "/LICENSE"]
license = "GPL-3.0-only"
readme = "README.md"
documentation = "https://docs.rs/mattermost-tui"
repository = "https://github.com/paulchambaz/mattermost-tui"
keywords = ["mattermost", "chat", "tui", "terminal", "client"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
directories = "6.0.0"
emojis = "0.9.0"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
portable-pty = "0.9.0"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
toml = "1.1.8"
unicode-width = "0.2.2"
vt100 = "0.16.2"

[[bin]]
name = "mm"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["rt", "macros", "sync", "time", "net", "io-util"] }
wiremock = "0.6.5"
