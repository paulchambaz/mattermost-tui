[package]
name = "mattermost-tui"
description = "Keyboard-driven terminal client for Mattermost"
authors = ["Paul Chambaz <paul.chambaz@tutanota.com>"]
homepage = "https://github.com/paulchambaz/mattermost-tui"
version = "0.1.0"
edition = "2021"
include = ["/src/**/*", "/mm.1.scd", "/README.md", "/LICENSE"]
license = "GPL-3.0-only"
readme = "README.md"
repository = "https://github.com/paulchambaz/mattermost-tui"
keywords = ["mattermost", "chat", "tui", "terminal"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt", "macros"] }
toml = "1.1.8"

[[bin]]
name = "mm"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["rt", "macros"] }
wiremock = "0.6.5"
